name: deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        type: choice
        options:
          - dev
          - stage
          - prod

permissions:
  id-token: write
  contents: read

jobs:
  terraform-plan-apply:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-1' }}

      - name: Terraform init
        run: terraform -chdir=infrastructure/terraform init

      - name: Terraform plan
        run: terraform -chdir=infrastructure/terraform plan -var="environment=${{ inputs.environment }}"

      - name: Terraform apply
        run: terraform -chdir=infrastructure/terraform apply -auto-approve -var="environment=${{ inputs.environment }}"
